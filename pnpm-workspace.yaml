packages:
  - 'packages/web'
  - 'packages/api'
  - 'packages/emails'

# NOTE: the @types/react single-version override lives in the ROOT package.json
# under "pnpm.overrides" — pnpm 9 (packageManager: pnpm@9.15.4) does NOT read an
# `overrides:` key from this file (that is a pnpm 10 feature), so an override here
# was silently ignored and CI kept resolving TWO @types/react copies. Why the
# override exists: the 18.x copy (pulled in via packages/emails' devDependency and
# styled-jsx's ^18 peer range) is hoisted next to packages/web's real
# @types/react@19 by pnpm's default *types* public-hoist-pattern, and the two get
# merged into one tsc program — producing bogus "Property 'children' is missing
# ... in type 'ReactPortal'" / TS2786 errors on every forwardRef component.
# packages/emails keeps its React 18 RUNTIME; only its @types/react is lifted to 19.
