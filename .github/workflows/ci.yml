name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Frontend checks
      - name: Lint Next.js
        run: pnpm --filter web lint

      - name: TypeScript check
        run: pnpm --filter web tsc --noEmit

      - name: Validate web build secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "Missing NEXT_PUBLIC_SUPABASE_URL secret"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "Missing NEXT_PUBLIC_SUPABASE_ANON_KEY secret"
            exit 1
          fi

      - name: Build Next.js
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Backend checks
      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0
        with:
          version: "0.11.16"
          enable-cache: true

      - name: Install FastAPI dependencies
        run: uv sync --frozen --no-dev
        working-directory: packages/api

      - name: Python syntax check
        run: uv run python -m compileall .
        working-directory: packages/api

      - name: FastAPI health check
        run: |
          set -euo pipefail
          cd packages/api

          export ALLOWED_ORIGINS=http://localhost:3000
          export SUPABASE_URL=https://placeholder.supabase.co
          export SUPABASE_SERVICE_ROLE_KEY=placeholder
          export REDIS_URL=redis://localhost:6379
          # Required at import time via routes.resume → core.ai_router
          export GROQ_API_KEY=ci-placeholder-groq
          export GEMINI_API_KEY=ci-placeholder-gemini
          # Required at import time via routes.jobs → services.job_fetcher
          export ADZUNA_APP_ID=ci-placeholder-adzuna
          export ADZUNA_APP_KEY=ci-placeholder-adzuna
          # Required at import time via core.embedding_service
          export OPENAI_API_KEY=ci-placeholder-openai
          # Required at import time via routes.applications → tasks.job_tasks
          # → services.browser_agent → core.browserbase
          export BROWSERBASE_API_KEY=ci-placeholder-browserbase
          export BROWSERBASE_PROJECT_ID=ci-placeholder-project
          # Required at import time via routes.stripe_router → core.stripe_client
          export STRIPE_SECRET_KEY=ci-placeholder-stripe

          uv run uvicorn main:app --host 127.0.0.1 --port 8000 --log-level info > uvicorn.log 2>&1 &
          UVICORN_PID=$!

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null; then
              echo "Health check passed"
              kill "$UVICORN_PID"
              exit 0
            fi
            sleep 1
          done

          echo "Health check failed; uvicorn output:"
          cat uvicorn.log || true
          kill "$UVICORN_PID" || true
          exit 1
