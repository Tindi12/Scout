name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Frontend checks
      - name: Lint Next.js
        run: pnpm --filter web lint

      - name: TypeScript check
        run: pnpm --filter web tsc --noEmit

      - name: Validate web build secrets
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "Missing NEXT_PUBLIC_SUPABASE_URL secret"
            exit 1
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ]; then
            echo "Missing NEXT_PUBLIC_SUPABASE_ANON_KEY secret"
            exit 1
          fi

      - name: Build Next.js
        run: pnpm --filter web build
        env:
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          CLERK_WEBHOOK_SECRET: ${{ secrets.CLERK_WEBHOOK_SECRET }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      # Backend checks
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Sanity-check requirements encoding
        run: |
          python - <<'PY'
          p = "packages/api/requirements.txt"
          b = open(p, "rb").read()
          if b"\x00" in b:
            raise SystemExit(f"{p} contains NUL bytes (bad encoding like UTF-16). Re-save as UTF-8.")
          print("requirements.txt looks OK")
          PY

      - name: Install FastAPI dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packages/api/requirements.txt

      - name: Python syntax check
        run: python -m compileall packages/api

      - name: FastAPI health check
        run: |
          cd packages/api
          ALLOWED_ORIGINS=http://localhost:3000 SUPABASE_URL=https://placeholder.supabase.co SUPABASE_SERVICE_ROLE_KEY=placeholder REDIS_URL=redis://localhost:6379 uvicorn main:app --host 127.0.0.1 --port 8000 &
          UVICORN_PID=$!
          sleep 3
          curl -f http://127.0.0.1:8000/health
          kill $UVICORN_PID
