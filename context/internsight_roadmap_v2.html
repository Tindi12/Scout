const wrap=document.getElementById('phases');
let total=0;

P.forEach(p=>{
  const items=p.sections.flatMap(s=>s.items);
  total+=items.length;
  const div=document.createElement('div');
  div.className='phase';
  div.innerHTML=`
    <div class="ph" onclick="tog(this)">
      <span class="badge" style="background:${p.bg};color:${p.tc}">${p.range}</span>
      <span class="ptitle">${p.title}</span>
      <span class="pprog" style="color:${p.color}" id="prog${p.id}">0/${items.length}</span>
      <span class="chev">▶</span>
    </div>
    <div class="pb2">
      <p class="pdesc">${p.desc}</p>
      ${p.sections.map(s=>`
        <div class="slabel">${s.label}</div>
        <div class="checks">
          ${s.items.map((c,i)=>`
            <label class="ci" id="ci${p.id}_${i}">
              <input type="checkbox" onchange="upd()">
              <span>${c}</span>
            </label>
          `).join('')}
        </div>
      `).join('')}
      <div class="slabel" style="margin-top:14px">Stack</div>
      <div class="chips">${p.tech.map(t=>`<span class="chip">${t}</span>`).join('')}</div>
      <div class="tip">${p.tip}</div>
    </div>
  `;
  wrap.appendChild(div);
});

document.getElementById('stasks').textContent=total;

function tog(el){
  const ph=el.closest('.phase');
  const open=ph.classList.contains('open');
  document.querySelectorAll('.phase').forEach(p=>p.classList.remove('open'));
  if(!open) ph.classList.add('open');
}

function upd(){
  const all=[...document.querySelectorAll('.pb2 input[type=checkbox]')];
  const done=all.filter(c=>c.checked).length;
  const pct=Math.round(done/total*100);
  document.getElementById('gbar').style.width=pct+'%';
  document.getElementById('dlabel').textContent=done+' tasks done';
  document.getElementById('plabel').textContent=pct+'%';
  document.getElementById('sdone').textContent=done;
  document.querySelectorAll('.ci').forEach(ci=>{
    ci.classList.toggle('done',ci.querySelector('input').checked);
  });
  P.forEach(p=>{
    const phEl=wrap.children[p.id];
    const cbs=[...phEl.querySelectorAll('input[type=checkbox]')];
    const d=cbs.filter(c=>c.checked).length;
    document.getElementById('prog'+p.id).textContent=d+'/'+cbs.length;
  });
}

wrap.children[0].classList.add('open');
</script>
